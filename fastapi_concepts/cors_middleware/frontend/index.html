<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frontend</title>
</head>
<body>
    <h1>Data from Backend</h1>
    <p id="retrieval"></p>
</body>
<script>
    fetch("http://127.0.0.1:8000/backend")
    .then(res => res.json())
    .then(data => {
        document.getElementById('retrieval').textContent = JSON.stringify(data);
    })
    .catch(err => {
        document.getElementById('retrieval').textContent = "Error:" + err;
    })
</script>
</html>
